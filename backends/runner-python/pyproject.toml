[project]
name = "coffeemail-runner-python"
version = "1.0.0"
description = "Runner FastAPI para o CoffeeMail Python SDK no Workbench"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "coffeemail>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
